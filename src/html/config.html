<section class="settings">
  <h2 class="settings-heading">日時基準ナビゲーションプラグイン設定</h2>
  <p class="kintoneplugin-desc">基準とするフィールド（日時または日付）を選択してください。ここで選択した項目をもとに「前へ」「次へ」の遷移が行われます。</p>
  
  <div class="kintoneplugin-row">
    <div class="kintoneplugin-label">基準とする対象フィールド<span class="kintoneplugin-require">*</span></div>
    <div class="kintoneplugin-select-outer">
      <div class="kintoneplugin-select">
        <select id="target-field-select">
          <option value="">-----</option>
        </select>
      </div>
    </div>
  </div>
  
  <p class="kintoneplugin-row">
    <button type="button" id="plugin-submit" class="kintoneplugin-button-dialog-ok">保存する</button>
    <button type="button" id="plugin-cancel" class="kintoneplugin-button-dialog-cancel">キャンセル</button>
  </p>
</section>
